name: UI Automation

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENV: qa
      ENV_VALID_EMAIL_ID: ${{ secrets.ENV_VALID_EMAIL_ID }}
      ENV_VALID_PASSWORD: ${{ secrets.ENV_VALID_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Run Ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Run tests
        run: pytest -m smoke --browser chromium

      - name: Generate Allure report
        if: always()
        run: |
          RESULTS_DIR=$(find artifacts -type d -name allure-results | head -1)
          if [ -n "$RESULTS_DIR" ]; then
            allure generate "$RESULTS_DIR" --clean -o allure-report
          fi

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/
          if-no-files-found: ignore
